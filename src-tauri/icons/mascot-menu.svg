<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" role="img" aria-label="Mascotte Quota Monitor">
  <!-- Optical monochrome reconstruction of assets/app-icon.png.
       Geometry also lives in scripts/render-tray-icon.mjs (runtime bitmap). -->
  <defs><mask id="cutouts">
    <rect width="44" height="44" fill="white"/>
    <circle cx="22" cy="23" r="7.5" fill="black"/>
    <rect x="16" y="33" width="12" height="1.5" rx=".75" fill="black"/>
    <rect x="17.5" y="36" width="9" height="1.5" rx=".75" fill="black"/>
  </mask></defs>
  <g fill="black">
    <circle cx="22" cy="4" r="2.5"/>
    <rect x="21" y="5" width="2" height="9" rx="1"/>
    <g mask="url(#cutouts)">
      <path d="M10 23a12 12 0 0 1 24 0Z"/>
      <rect x="10" y="21" width="24" height="18" rx="1.5"/>
      <rect x="13" y="36" width="7" height="6" rx="1.5"/>
      <rect x="24" y="36" width="7" height="6" rx="1.5"/>
    </g>
    <!-- One solid pupil, with a broad uninterrupted counterform at 16pt. -->
    <circle cx="22" cy="23" r="3.5"/>
  </g>
</svg>
